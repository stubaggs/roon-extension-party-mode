<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RoonParty</title>
    <link rel="stylesheet" href="/party.css" />
    <link rel="stylesheet" href="/roonparty.css" />
  </head>
  <body class="roonparty">
    <div class="stage">
      <section class="join">
        <h1 id="party-name">Party</h1>
        <img id="qr" class="qr" src="/api/qr.svg" alt="Scan to add a song" />
        <p class="join-copy">Scan to put a song on</p>
        <p class="join-url"><a class="join-link muted" id="join-link" target="_blank" rel="noopener"></a></p>
      </section>

      <section class="stack">
        <div class="current">
          <img class="art current-art" id="current-art" alt="" />
          <div>
            <p class="current-label" id="current-label">Playing now</p>
            <h2 class="current-title" id="current-title">Nothing playing</h2>
            <p class="current-artist muted" id="current-artist"></p>
          </div>
        </div>
        <ol class="list" id="list"></ol>
      </section>
    </div>
    <script src="/roonparty.js"></script>
  </body>
</html>
