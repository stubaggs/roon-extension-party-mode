<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="page.screen_title">RoonParty</title>
    <link rel="stylesheet" href="/party.css" />
    <link rel="stylesheet" href="/roonparty.css" />
  </head>
  <body class="roonparty">
    <div class="stage">
      <section class="join">
        <h1 id="party-name" data-i18n="party.default_name">Party</h1>
        <div id="join-open">
          <img id="qr" class="qr" src="/api/qr.svg" alt="Scan to add a track" data-i18n-alt="screen.qr_alt" />
          <p class="join-copy"><a class="join-link" id="join-link" target="_blank" rel="noopener" data-i18n="screen.scan">Scan to add a track</a></p>
        </div>
        <!-- With party mode off: requests are closed, and the playlist is ready,
             as a QR code or a link as the Display playlist download setting says. -->
        <div id="join-closed" class="join-closed" hidden>
          <p class="closed-title" data-i18n="screen.closed_title">Requests are closed</p>
          <p class="closed-text muted" data-i18n="screen.closed_text">Thanks for all the tracks.</p>
          <div id="playlist-qr-offer" hidden>
            <img id="playlist-qr" class="qr" alt="Scan to download the playlist" data-i18n-alt="screen.playlist_qr_alt" />
            <p class="join-copy"><a class="join-link" href="/api/playlist.csv" download data-i18n="screen.scan_playlist">Scan to download the playlist</a></p>
          </div>
          <a id="playlist-link-offer" class="pill pill-primary download" href="/api/playlist.csv" download hidden data-i18n="screen.download_playlist">Download the playlist</a>
        </div>
      </section>

      <section class="stack">
        <div class="current">
          <img class="art current-art" id="current-art" alt="" />
          <div class="current-text">
            <p class="current-label" id="current-label" data-i18n="playing.now">Playing now</p>
            <h2 class="current-title" id="current-title" data-i18n="playing.nothing">Nothing playing</h2>
            <p class="current-artist muted" id="current-artist"></p>
            <p class="current-who" id="current-who" hidden></p>
          </div>
        </div>
      </section>

      <section class="upnext">
        <h2 class="upnext-title" data-i18n="queue.up_next">Up next</h2>
        <ol class="list" id="list"></ol>
      </section>
    </div>
    <script src="/i18n.js"></script>
    <script src="/roonparty.js"></script>
    <script src="/marquee.js" data-marquee=".current-title, .current-artist, .list .t, .list .a"></script>
  </body>
</html>
