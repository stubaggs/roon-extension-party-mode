<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Party Hub</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/party.css" />
    <link rel="stylesheet" href="/hub.css" />
  </head>
  <body class="hub">
    <!-- A small menu in the corner, for the host: nothing a guest needs. -->
    <nav class="hub-menu">
      <button type="button" id="menu-button" class="menu-button" aria-expanded="false" aria-controls="menu" aria-label="Menu" data-i18n-aria-label="screen.menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
      <ul id="menu" class="menu" hidden>
        <!-- In English, as the About page is. In a new tab: it can't be shown in a
             frame, as the Hub can. -->
        <li><a href="/About" target="_blank" rel="noopener" lang="en" dir="ltr">About Party Mode</a></li>
      </ul>
    </nav>
    <main class="stage">
      <section class="join">
        <h1 id="party-name" data-i18n="party.default_name">Party</h1>
        <div id="join-open">
          <img id="qr" class="qr" src="/api/qr.svg" alt="QR code for the guest page" data-i18n-alt="screen.qr_alt" />
          <p class="join-copy"><a class="join-link" id="join-link" target="_blank" rel="noopener" data-i18n="screen.scan">Scan to add a track</a></p>
        </div>
        <!-- With Party off: the playlist in place of the guest code, as a QR
             code or a link as the Party playlist setting says. -->
        <div id="join-closed" class="join-closed" hidden>
          <div id="playlist-qr-offer" hidden>
            <img id="playlist-qr" class="qr" alt="QR code for the playlist" data-i18n-alt="screen.playlist_qr_alt" />
            <p class="join-copy"><a id="playlist-qr-link" class="join-link" download data-i18n="screen.scan_playlist">Scan to download the playlist</a></p>
          </div>
          <a id="playlist-link-offer" class="pill pill-primary download" download hidden data-i18n="screen.download_playlist">Download the playlist</a>
        </div>
      </section>

      <section class="stack">
        <!-- With Party off, in place of what's playing. -->
        <div id="closed" class="closed-message" hidden>
          <h2 class="closed-title" data-i18n="screen.closed_title">Requests are closed</h2>
          <p class="closed-text muted" data-i18n="screen.closed_text">Thanks for all the tracks.</p>
        </div>
        <div class="current" id="current">
          <img class="art current-art" id="current-art" alt="" />
          <div class="current-text">
            <p class="current-label" id="current-label" data-i18n="playing.now">Playing now</p>
            <h2 class="current-title" id="current-title" data-i18n="playing.nothing">Nothing playing</h2>
            <p class="current-artist muted" id="current-artist"></p>
            <p class="current-album muted" id="current-album" hidden></p>
            <p class="current-who" id="current-who" hidden></p>
            <p class="current-note muted" id="current-note" data-i18n="queue.waiting_for_host" hidden>Waiting for the host to start the queue.</p>
          </div>
        </div>
      </section>

      <section class="upnext">
        <h2 class="upnext-title" data-i18n="queue.up_next">Up next</h2>
        <ol class="list" id="list"></ol>
      </section>
    </main>
    <script src="/i18n.js?for=hub"></script>
    <script src="/hub.js"></script>
    <script src="/marquee.js" data-marquee=".current-title, .current-artist, .current-album, .list .t, .list .a"></script>
  </body>
</html>
