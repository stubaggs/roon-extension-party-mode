<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#170f2b" />
    <title>Add a song</title>
    <link rel="stylesheet" href="/party.css" />
    <link rel="stylesheet" href="/guest.css" />
  </head>
  <body>
    <main id="app" hidden>
      <section class="playing" id="playing">
        <img class="art playing-art" id="playing-art" alt="" width="72" height="72" />
        <div class="playing-text">
          <p class="playing-label" id="playing-label">Playing now</p>
          <h1 class="playing-title" id="playing-title">Nothing yet</h1>
          <p class="playing-artist muted" id="playing-artist"></p>
          <p class="playing-who" id="playing-who" hidden></p>
        </div>
        <button class="pill pill-ghost skip" id="skip" hidden>Skip</button>
      </section>

      <div class="searchbar">
        <input
          id="search"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="Search for a song or artist"
          aria-label="Search for a song or artist"
        />
        <button class="search-clear" id="search-clear" type="button" aria-label="Clear search" hidden>
          &times;
        </button>
      </div>

      <p class="tokens muted" id="tokens"></p>
      <p class="whoami muted">
        <span id="whoami"></span>
        <button class="link-button" id="whoami-change" type="button"></button>
      </p>

      <section id="results" class="rows" aria-live="polite"></section>

      <section class="upnext">
        <h2>Up next</h2>
        <ol id="queue" class="rows queue"></ol>
      </section>

      <section class="upnext">
        <h2>Played</h2>
        <ol id="played" class="rows queue played"></ol>
      </section>
    </main>

    <div id="locked" class="locked">
      <h1>Scan the code again</h1>
      <p class="muted">
        This link only works after scanning the code on the party screen. Ask the host to show it.
      </p>
    </div>

    <div class="nickname-backdrop" id="nickname" hidden>
      <form class="nickname" id="nickname-form" role="dialog" aria-modal="true" aria-labelledby="nickname-title">
        <h2 id="nickname-title">What should we call you?</h2>
        <p class="muted">Your name shows next to the songs you add, so everyone knows who to thank.</p>
        <input
          id="nickname-input"
          type="text"
          maxlength="24"
          autocomplete="nickname"
          autocapitalize="words"
          enterkeyhint="go"
          placeholder="Your name"
          aria-label="Your name"
        />
        <div class="nickname-actions">
          <button class="pill pill-primary" type="submit">Let's go</button>
          <button class="pill pill-ghost" id="nickname-skip" type="button">Skip</button>
        </div>
      </form>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/guest.js"></script>
    <script src="/marquee.js" data-marquee=".playing-title, .playing-artist, .row-title, .row-sub"></script>
  </body>
</html>
