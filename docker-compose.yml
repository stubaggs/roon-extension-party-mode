# Host networking is required: Roon discovery uses UDP broadcast on port 9003.
# Settings, including Roon's pairing token, are kept in the volume
# roon-extension-party-mode-beta-data (the same one the README's docker run
# uses), which Docker creates on the first `docker compose up -d`.
services:
  party-mode:
    image: stubaggs/roon-extension-party-mode:beta
    container_name: roon-extension-party-mode-beta
    network_mode: host
    restart: unless-stopped
    # Nothing in the image can change (settings save to the volume), no Linux
    # capabilities, and no gaining privileges.
    read_only: true
    # A cap well above what Party Mode uses (under 100 MB at a busy party), so a
    # runaway can't take memory from the Roon Core or anything else on the host.
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # To set one of these, remove the # from `environment:` and from its line.
    # environment:
      # Unset, the first run uses 8338, or the next free port if it's busy, and keeps
      # it. Set, it's that port or nothing. Change it later with Web port in Roon.
      # - ROON_EXTENSION_PARTY_MODE_PORT=8338
      # - ROON_EXTENSION_PARTY_MODE_DEBUG=1   # detailed log, including every message to and from Roon
      # - ROON_EXTENSION_PARTY_MODE_INSTANCE=Garden   # a name, to run more than one copy (see the README)
    volumes:
      - party-mode-data:/data
    # Keep the log from growing without limit.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  party-mode-data:
    # Its own name, rather than one Compose makes from the folder's name. A
    # second copy needs a name of its own here too (see the README).
    name: roon-extension-party-mode-beta-data
