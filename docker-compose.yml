# Host networking is required: Roon discovery uses UDP broadcast on port 9003.
# The extension runs as uid 1000 and saves its settings to ./config.json, so
# create it writable first: touch config.json && chmod 666 config.json
services:
  party-mode:
    image: stubaggs/roon-extension-party-mode:latest
    container_name: roon-extension-party-mode
    network_mode: host
    restart: unless-stopped
    environment:
      - ROON_EXTENSION_PARTY_MODE_PORT=8338   # port to start on, until one is saved in Roon
      # - ROON_EXTENSION_PARTY_MODE_DEBUG=1   # detailed log, including every message to and from Roon
    volumes:
      - ./config.json:/usr/src/app/config.json
    # Keep the log from growing without limit.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
