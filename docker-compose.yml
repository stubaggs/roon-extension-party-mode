# Host networking is required: Roon discovery uses UDP broadcast on port 9003.
# The extension runs as uid 1000 and saves its settings to ./config.json, so
# create it writable by that user first (it holds Roon's pairing token):
#   touch config.json && sudo chown 1000 config.json && chmod 600 config.json
# or, without sudo, chmod 666 config.json (readable by every account).
services:
  party-mode:
    image: stubaggs/roon-extension-party-mode:latest
    container_name: roon-extension-party-mode
    network_mode: host
    restart: unless-stopped
    environment:
      # The web port. Set here, it wins over Roon's Web port setting, which then shows it.
      # If it's busy at startup, the next free port is used.
      - ROON_EXTENSION_PARTY_MODE_PORT=8338
      # - ROON_EXTENSION_PARTY_MODE_DEBUG=1   # detailed log, including every message to and from Roon
    volumes:
      - ./config.json:/usr/src/app/config.json
    # Keep the log from growing without limit.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
