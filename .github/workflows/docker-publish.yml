# Builds the image the Extension Manager installs and pushes it to Docker Hub.
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
#
# Which tags depends on the branch picked under "Use workflow from":
#   main          latest, and the version (e.g. 1.1.1)
#   experimental  experimental, and the version (e.g. 1.2.0-experimental)
# Any other branch is refused, and experimental never pushes latest or a plain
# release number, so the Extension Manager (which installs latest) never gets it.
name: Publish Docker image

# Manual only for now, while the extension is still being tested: run it from the
# Actions tab when you want to publish. Restore the push trigger to publish on merge:
#   push:
#     branches: [main]
#     tags: ['v*']
#
# Restore the schedule to rebuild and republish every Monday, so installed copies
# pick up Alpine and Node security fixes without anyone publishing by hand. A
# rebuild only gets newer base layers if the Dockerfile's FROM lines allow it:
# either drop the @sha256 digest so each build uses the current node:22-alpine,
# or keep the digest and merge Dependabot's update pull requests.
#   schedule:
#     - cron: '17 4 * * 1'
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version Roon shows, from package.json, as an image tag. On the
      # experimental branch it must carry a suffix ("1.2.0-experimental"), so an
      # experimental build can't take a release's number.
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/heads/experimental)
              case "$version" in
                *-*) ;;
                *) echo "::error::package.json on experimental says $version; use a suffix such as $version-experimental"; exit 1 ;;
              esac ;;
            *) echo "::error::Publish from main or experimental, not $GITHUB_REF"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/roon-extension-party-mode
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=experimental,enable=${{ github.ref == 'refs/heads/experimental' }}
            type=raw,value=${{ steps.version.outputs.version }}

      # arm/v6 and arm/v7 both install under the repository entry's "arm" key:
      # Docker reports every 32-bit ARM host (Pi Zero and Pi 1 are v6) as "arm".
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
