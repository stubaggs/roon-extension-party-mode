# Static security analysis of the extension's JavaScript and of the workflows
# themselves. Results appear under the repository's Security tab → Code scanning.
# It only reads the code: it builds and publishes nothing.
name: CodeQL

on:
  push:
    branches: [main, experimental]
  pull_request:
    branches: [main, experimental]
  # Weekly, so new queries catch issues in code that hasn't changed.
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
